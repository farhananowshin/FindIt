version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. MongoDB Database
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: findit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=findit
    volumes:
      - mongodb_data:/data/db
    networks:
      - findit-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. AI Microservice (FastAPI + PyTorch + OpenCLIP + S-BERT)
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: findit-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/findit
      - UPLOADS_DIR=/app/uploads
      - CLIP_MODEL=ViT-B-32
      - CLIP_PRETRAINED=openai
      - SBERT_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - DEFAULT_TOP_K=5
      - MAX_TOP_K=20
      - PYTHONUNBUFFERED=1
    volumes:
      - uploads_data:/app/uploads
      - model_cache:/root/.cache
    networks:
      - findit-network
    depends_on:
      mongodb:
        condition: service_healthy

  # -------------------------------------------------------------
  # 3. Express.js Backend API
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/findit
      - FRONTEND_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai-service:8001
      - JWT_SECRET=findit_super_secret_jwt_key_2026_campus_secure
      - JWT_EXPIRES_IN=7d
      - ADMIN_NAME=Campus Security Admin
      - ADMIN_EMAIL=admin@campus.edu
      - ADMIN_PASSWORD=AdminSecure2026!
      - ADMIN_STUDENT_ID=ADMIN-001
      - ADMIN_PHONE=+1 (555) 019-9000
    volumes:
      - uploads_data:/app/uploads
    networks:
      - findit-network
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started

  # -------------------------------------------------------------
  # 4. Next.js 16 Frontend Web Application
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: findit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    networks:
      - findit-network
    depends_on:
      - backend

# ---------------------------------------------------------------
# Shared Persistent Volumes and Bridge Network
# ---------------------------------------------------------------
volumes:
  mongodb_data:
    name: findit_mongodb_data
  uploads_data:
    name: findit_uploads_data
  model_cache:
    name: findit_model_cache

networks:
  findit-network:
    name: findit-network
    driver: bridge
